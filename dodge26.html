  const MAP_BOUNDS = {
    north: 40.74570, // Top latitude
    south: 40.73566, // Bottom latitude
    west: -74.17456, // Left longitude
    east: -74.16475  // Right longitude
  };

  const mapImage = document.getElementById('map-image');
  const userDot = document.getElementById('user-dot');
  
  function updateMarkerPosition(lat, lng) {
    const xPct = ((lng - MAP_BOUNDS.west) / (MAP_BOUNDS.east - MAP_BOUNDS.west)) * 100;    
    const yPct = ((MAP_BOUNDS.north - lat) / (MAP_BOUNDS.north - MAP_BOUNDS.south)) * 100;

    if (xPct >= 0 && xPct <= 100 && yPct >= 0 && yPct <= 100) {
      userDot.style.left = `${xPct}%`;
      userDot.style.top = `${yPct}%`;
      userDot.style.display = 'block';
    } else {
      userDot.style.display = 'none';
    }
  }

  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(
      (position) => {
        const { latitude, longitude } = position.coords;
        updateMarkerPosition(latitude, longitude);
      },
      (error) => {
        console.error("GPS Error:", error.message);
      },
      {
        enableHighAccuracy: true, // Uses hardware GPS if available
        maximumAge: 1000,
        timeout: 5000
      }
    );
  } 

  function highlightTarget(targetId) {
   const target = document.getElementById(targetId);
   if (!target) return; 

   document.querySelectorAll('.map-target').forEach(el => el.classList.remove('highlighted'));
       
   if (target) {
      target.classList.add('highlighted');

    target.classList.remove('highlighted');

  function isCurrentSession(startTime, endTime) {
    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();

    const [startH, startM] = startTime.split(':').map(Number);
    const [endH, endM] = endTime.split(':').map(Number);

    const startMinutes = startH * 60 + startM;
    const endMinutes = endH * 60 + endM;

    return currentMinutes >= startMinutes && currentMinutes <= endMinutes;
  }

  let activeTab = 'current';    
  let selectedTargetId = null;

  function renderSessions() {
    const container = document.getElementById('sessions-list');

    container.innerHTML = '';

    let filtered = SESSIONS;
    if (activeTab === 'current') {
      filtered = filtered.filter(s => isCurrentSession(s.startTime, s.endTime));
    }

    if (selectedTargetId) {
      filtered = filtered.filter(s => s.targetId === selectedTargetId);
    }

    if (filtered.length === 0) {
      const message = selectedTargetId 
        ? "No sessions found at this location for the selected view." 
        : "No active sessions right now.";
      container.innerHTML = `<p style="color:#777; padding: 10px 0;">${message}</p>`;
      return;
    }

   filtered.forEach(session => {
      const card = document.createElement('div');
      card.className = 'session-card';
      card.innerHTML = `
        <div class="session-header" onclick="highlightTarget('${session.targetId}')">
          <div>
            <div class="session-title">${session.title}</div>
            <div class="session-time">${session.startTime} - ${session.endTime} (${session.location})</div>
          </div>
          <button class="toggle-btn" onclick="toggleDescription(event, this)">▼</button>
        </div>
        <div class="session-description">
          ${session.description || 'No description provided.'}
        </div>
      `;
      container.appendChild(card);
    });
  }

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('tab-current').classList.toggle('active', tab === 'current');
    document.getElementById('tab-all').classList.toggle('active', tab === 'all');
    renderSessions();
  }
   
  function selectMapLocation(targetId) {
    selectedTargetId = targetId;
    
    highlightTarget(targetId);

    const banner = document.getElementById('filter-banner');
    const filterText = document.getElementById('filter-text');
    banner.style.display = 'flex';
    filterText.innerText = `Filtered: ${targetId.toUpperCase()}`;

    renderSessions();
  }  

  function clearLocationFilter() {
    selectedTargetId = null;
    document.getElementById('filter-banner').style.display = 'none';
    document.querySelectorAll('.map-target').forEach(el => el.classList.remove('highlighted'));
    renderSessions();
  }

document.addEventListener('DOMContentLoaded', () => {
    const svgElement = document.querySelector('.map-svg');

    svgElement.addEventListener('click', (event) => {
      const targetShape = event.target.closest('.map-target');

      if (targetShape) {
        // Clicked a specific location area or key
        const targetId = targetShape.getAttribute('onclick')?.match(/'([^']+)'/)?.[1] || targetShape.id;
        if (targetId) {
          selectMapLocation(targetId);
        }
      } else {
        // Clicked outside any map shape (Reset Filter)
        clearLocationFilter();
      }
    });

    renderSessions();
  });

function isCurrentSession(startTime, endTime) {
    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();

    const [startH, startM] = startTime.split(':').map(Number);
    const [endH, endM] = endTime.split(':').map(Number);

    return currentMinutes >= (startH * 60 + startM - 30) && currentMinutes <= (endH * 60 + endM);
  }

  function toggleDescription(event, btn) {
    event.stopPropagation();

    const card = btn.closest('.session-card');
    const isExpanded = card.classList.toggle('expanded');

    btn.innerHTML = isExpanded ? '▲' : '▼';
  }

  document.addEventListener('DOMContentLoaded', renderSessions);

</script>
