<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockland Poets — Edit Attendee</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="header">
    <img src="logo.png" alt="Rockland Poets" style="height:44px; width:auto;">
    <a href="checkin.html" style="font-size:0.8rem; color:var(--wine); text-decoration:none;">← Check-in</a>
  </div>

  <div id="deniedNotice" style="display:none;" class="error-box">
    This page is only available to organizers and admins.
  </div>

  <div id="mainArea" style="display:none;">
    <h1 style="font-size:1.3rem; margin-bottom:12px;">Edit attendee info</h1>
    <input type="text" id="search" placeholder="Search by name…" autocomplete="off" style="margin-bottom:12px;">
    <div id="results"></div>

    <div id="editForm" class="card" style="display:none;">
      <label for="editFirst">First name</label>
      <input type="text" id="editFirst">
      <label for="editLast">Last name</label>
      <input type="text" id="editLast">
      <label for="editNickname">Nickname</label>
      <input type="text" id="editNickname">
      <label for="editEmail">Email</label>
      <input type="email" id="editEmail">
      <label for="editPhone">Phone</label>
      <input type="tel" id="editPhone">
      <label for="editPronouns">Pronouns</label>
      <input type="text" id="editPronouns">
      <label for="editReferral">Referral source</label>
      <select id="editReferral"><option value="">— None —</option></select>
      <label for="editStatus">Status</label>
      <select id="editStatus">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
        <option value="deceased">Deceased</option>
      </select>

      <div id="editError" class="error-box" style="display:none;"></div>

      <button class="btn-primary" id="saveBtn" style="margin-top:16px;">Save changes</button>
      <button class="btn-ghost" id="cancelEditBtn" style="margin-top:4px;">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) window.location.href = 'login.html';

  const { data: roleRow } = await supabase.from('organizer_roles').select('role').eq('user_id', session.user.id).maybeSingle();
  const myRole = roleRow?.role;

  if (myRole !== 'organizer' && myRole !== 'admin') {
    document.getElementById('deniedNotice').style.display = 'block';
  } else {
    document.getElementById('mainArea').style.display = 'block';
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadReferralSources() {
    const { data } = await supabase.from('referral_sources').select('id, label').order('label');
    const sel = document.getElementById('editReferral');
    for (const r of data || []) {
      const opt = document.createElement('option');
      opt.value = r.id;
      opt.textContent = r.label;
      sel.appendChild(opt);
    }
  }
  loadReferralSources();

  const searchEl = document.getElementById('search');
  const resultsEl = document.getElementById('results');
  let searchDebounce;
  let editingId = null;

  searchEl.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(runSearch, 250);
  });

  async function runSearch() {
    const q = searchEl.value.trim();
    resultsEl.innerHTML = '';
    document.getElementById('editForm').style.display = 'none';
    if (q.length < 2) return;

    // Organizer-only view -- search the raw table directly, not the
    // privacy-limited public attendee_display view
    const { data, error } = await supabase.from('attendees')
      .select('id, first_name, last_name, nickname')
      .or(`first_name.ilike.%${q}%,last_name.ilike.%${q}%,nickname.ilike.%${q}%`)
      .limit(20);

    if (error) { resultsEl.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }
    if (!data || data.length === 0) { resultsEl.innerHTML = '<div class="empty-state">No match found.</div>'; return; }

    for (const a of data) {
      const label = [a.nickname, [a.first_name, a.last_name].filter(Boolean).join(' ')].filter(Boolean).join(' / ');
      const row = document.createElement('button');
      row.className = 'roster-row';
      row.style.cssText += 'border:1px solid var(--line); border-left:4px solid var(--brass); cursor:pointer; font-family:inherit;';
      row.innerHTML = `<span class="name">${escapeHtml(label)}</span><span class="meta">Tap to edit</span>`;
      row.addEventListener('click', () => loadForEdit(a.id));
      resultsEl.appendChild(row);
    }
  }

  async function loadForEdit(id) {
    const { data: a, error } = await supabase.from('attendees').select('*').eq('id', id).single();
    if (error) { toast('Could not load: ' + error.message); return; }

    editingId = id;
    document.getElementById('editFirst').value = a.first_name || '';
    document.getElementById('editLast').value = a.last_name || '';
    document.getElementById('editNickname').value = a.nickname || '';
    document.getElementById('editEmail').value = a.email || '';
    document.getElementById('editPhone').value = a.phone || '';
    document.getElementById('editPronouns').value = a.pronouns || '';
    document.getElementById('editReferral').value = a.referral_source_id || '';
    document.getElementById('editStatus').value = a.status || 'active';
    document.getElementById('editError').style.display = 'none';
    document.getElementById('editForm').style.display = 'block';
  }

  document.getElementById('cancelEditBtn').addEventListener('click', () => {
    document.getElementById('editForm').style.display = 'none';
    editingId = null;
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    if (!editingId) return;
    const errEl = document.getElementById('editError');
    errEl.style.display = 'none';

    const first = document.getElementById('editFirst').value.trim();
    if (!first) { errEl.textContent = 'First name is required.'; errEl.style.display = 'block'; return; }

    const payload = {
      first_name: first,
      last_name: document.getElementById('editLast').value.trim() || null,
      nickname: document.getElementById('editNickname').value.trim() || null,
      email: document.getElementById('editEmail').value.trim() || null,
      phone: document.getElementById('editPhone').value.trim() || null,
      pronouns: document.getElementById('editPronouns').value.trim() || null,
      referral_source_id: document.getElementById('editReferral').value || null,
      status: document.getElementById('editStatus').value,
    };

    const { error } = await supabase.from('attendees').update(payload).eq('id', editingId);
    if (error) { errEl.textContent = 'Save failed: ' + error.message; errEl.style.display = 'block'; return; }

    toast('Saved.');
    document.getElementById('editForm').style.display = 'none';
    editingId = null;
    searchEl.value = '';
    resultsEl.innerHTML = '';
  });
</script>
</body>
</html>
