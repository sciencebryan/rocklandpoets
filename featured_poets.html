<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockland Poets — Featured Poets</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="header">
    <img src="logo.png" alt="Rockland Poets" style="height:44px; width:auto;">
    <a href="leaderboard.html" style="font-size:0.85rem; color:var(--wine); text-decoration:none;">Leaderboard</a>
  </div>

  <h1 style="font-size:1.4rem; margin-bottom:16px;">Featured Poets</h1>

  <div id="upcoming"></div>
  <div id="divider" style="display:none; text-align:center; color:var(--ink-soft); margin:24px 0; font-size:0.85rem; border-top:1px solid var(--line); padding-top:16px;">Past featured poets</div>
  <div id="past"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function extractYouTubeId(url) {
    if (!url) return null;
    try {
      const u = new URL(url);
      if (u.hostname.includes('youtu.be')) return u.pathname.slice(1) || null;
      if (u.hostname.includes('youtube.com')) {
        if (u.pathname === '/watch') return u.searchParams.get('v');
        if (u.pathname.startsWith('/embed/')) return u.pathname.split('/embed/')[1] || null;
      }
    } catch (e) { /* not a valid URL at all */ }
    return null;
  }

  function poetRow(p) {
    const videoId = extractYouTubeId(p.youtube_url);
    const hasExtra = !!(p.bio || p.website_url || p.youtube_url);

    const div = document.createElement('div');
    div.className = 'card';
    if (hasExtra) div.style.cursor = 'pointer';

    const summary = document.createElement('div');
    summary.style.cssText = 'display:flex; justify-content:space-between; align-items:center;';
    summary.innerHTML = `
      <div>
        <div class="mono meta">${escapeHtml(p.feature_date)}</div>
        <div style="font-weight:600; font-size:1.1rem; margin-top:2px;">${escapeHtml(p.poet_name)}</div>
      </div>
      ${hasExtra ? '<span class="arrow" style="font-size:1.1rem; color:var(--wine);">▾</span>' : ''}
    `;

    const details = document.createElement('div');
    details.style.display = 'none';
    details.innerHTML = `
      ${p.bio ? `<div style="margin-top:8px;">${escapeHtml(p.bio)}</div>` : ''}
      ${p.website_url ? `<div style="margin-top:8px;"><a href="${escapeHtml(p.website_url)}" target="_blank" style="color:var(--wine);">Website →</a></div>` : ''}
      ${videoId
        ? `<div style="margin-top:12px; position:relative; padding-top:56.25%;">
             <iframe src="https://www.youtube.com/embed/${escapeHtml(videoId)}" title="${escapeHtml(p.poet_name)}"
               style="position:absolute; top:0; left:0; width:100%; height:100%; border:0; border-radius:var(--radius);"
               allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
           </div>`
        : (p.youtube_url ? `<div style="margin-top:8px;"><a href="${escapeHtml(p.youtube_url)}" target="_blank" style="color:var(--wine);">Watch on YouTube →</a></div>` : '')
      }
    `;

    if (hasExtra) {
      div.addEventListener('click', () => {
        const expanded = details.style.display !== 'none';
        details.style.display = expanded ? 'none' : 'block';
        const arrow = summary.querySelector('.arrow');
        if (arrow) arrow.textContent = expanded ? '▾' : '▴';
      });
    }

    div.appendChild(summary);
    div.appendChild(details);
    return div;
  }

  async function load() {
    const { data, error } = await supabase.from('featured_poets').select('*').order('feature_date', { ascending: true });
    const upcomingEl = document.getElementById('upcoming');
    const pastEl = document.getElementById('past');

    if (error) { upcomingEl.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }
    if (!data || data.length === 0) { upcomingEl.innerHTML = '<div class="empty-state">No featured poets scheduled yet.</div>'; return; }

    const today = new Date().toISOString().slice(0, 10);
    const upcoming = data.filter(p => p.feature_date >= today); // already ascending -- soonest first
    const past = data.filter(p => p.feature_date < today).reverse(); // most recent past first, going further back

    if (upcoming.length === 0) {
      upcomingEl.innerHTML = '<div class="empty-state">No upcoming featured poets scheduled yet.</div>';
    } else {
      for (const p of upcoming) upcomingEl.appendChild(poetRow(p));
    }

    if (past.length > 0) {
      document.getElementById('divider').style.display = 'block';
      for (const p of past) pastEl.appendChild(poetRow(p));
    }
  }

  load();
</script>
</body>
</html>
