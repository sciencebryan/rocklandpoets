<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockland Poets Event Staffing</title>
<link rel="stylesheet" href="style.css">
<style>
  .staff-table { border-collapse: collapse; width: max-content; min-width: 100%; }
  .staff-table th, .staff-table td {
    border: 1px solid var(--line);
    padding: 8px 10px;
    text-align: left;
    font-size: 0.85rem;
    vertical-align: top;
  }
  .staff-table td.assign-cell { white-space: nowrap; }
  .staff-table td.assign-cell.editing { white-space: normal; min-width: 170px; }
  .staff-table th { background: var(--paper); position: sticky; top: 0; z-index: 1; }
  .staff-table th.corner { position: sticky; left: 0; z-index: 2; background: var(--paper); }
  .staff-table td.event-cell { font-weight: 600; position: sticky; left: 0; background: var(--paper-raised); white-space: nowrap; }
  .staff-table td.assign-cell { cursor: default; min-width: 90px; }
  .staff-table td.assign-cell.clickable { cursor: pointer; }
  .staff-table td.assign-cell.clickable:hover { background: var(--moss-bg); }
  .staff-table-wrapper { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); max-height: 70vh; overflow-y: auto; }
  .cell-person-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 0.8rem; margin-bottom: 2px; }
  .cell-x-btn { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 0.85rem; padding: 0 2px; min-height: auto; }
  .cell-select { font-size: 0.8rem; padding: 4px 6px; min-height: auto; width: 100%; margin-top: 4px; }
  .cell-close-btn { font-size: 0.75rem; color: var(--ink-soft); background: none; border: none; cursor: pointer; padding: 2px 0; margin-top: 4px; min-height: auto; text-decoration: underline; }
</style>
</head>
<body>
<div class="page" style="max-width: 100%;">
  <div class="header">
    <img src="logo.png" alt="Rockland Poets" style="height:44px; width:auto;">
    <a href="checkin.html" style="font-size:0.8rem; color:var(--wine); text-decoration:none;">← Check-in</a>
  </div>

  <h1 style="font-size:1.3rem; margin-bottom:6px;">Event staffing</h1>
  <p class="meta" style="margin-bottom:16px;">Click a cell to assign or edit who's working that role.</p>

  <div id="addRoleRow" style="display:none; margin-bottom:12px;">
    <input type="text" id="newRoleName" placeholder="Add a role column (e.g. Setup)" style="display:inline-block; width:auto; max-width:220px;">
    <button class="btn-secondary" id="addRoleBtn" style="display:inline-block; width:auto; padding:12px 16px;">+ Add role column</button>
  </div>

  <div class="staff-table-wrapper">
    <table class="staff-table" id="staffTable"></table>
  </div>

  <button class="btn-secondary" id="loadMoreBtn" style="margin-top:16px;">Load more months</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) window.location.href = 'login.html';

  const { data: roleRow } = await supabase.from('organizer_roles').select('role').eq('user_id', session.user.id).maybeSingle();
  const isAdmin = roleRow?.role === 'admin';
  if (isAdmin) document.getElementById('addRoleRow').style.display = 'block';

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  const MAX_PER_ROLE = 2;
  const TYPE_LABEL = { slam: 'Slam', open_mic: 'Open mic' };

  function addMonths(date, n) {
    const d = new Date(date);
    d.setMonth(d.getMonth() + n);
    return d;
  }
  const isoDate = (d) => d.toISOString().slice(0, 10);

  let rangeStart = isoDate(addMonths(new Date(), -1));
  let rangeEnd = isoDate(addMonths(new Date(), 6));
  let extraRoleCols = [];
  let events = [];
  let assignments = [];
  let nameById = {};
  let pool = []; // [{id, name}]
  let editingCell = null; // { eventId, role } or null

  async function loadPool() {
    const { data } = await supabase.from('event_staff_pool').select('id, name').order('name');
    pool = data || [];
  }

  async function loadData() {
    const { data: evData } = await supabase.from('events').select('id, event_date, event_type')
      .in('event_type', ['slam', 'open_mic'])
      .gte('event_date', rangeStart).lte('event_date', rangeEnd)
      .order('event_date', { ascending: true });
    events = evData || [];

    const eventIds = events.map(e => e.id);
    const { data: asgData } = eventIds.length
      ? await supabase.from('event_staff_assignments').select('id, event_id, role_label, person_id').in('event_id', eventIds)
      : { data: [] };
    assignments = asgData || [];

    const personIds = [...new Set(assignments.map(a => a.person_id))];
    if (personIds.length) {
      const { data: people } = await supabase.from('event_staff_pool').select('id, name').in('id', personIds);
      nameById = Object.fromEntries((people || []).map(p => [p.id, p.name]));
    } else {
      nameById = {};
    }

    renderTable();
  }

  function getRoleCols() {
    const usedRoles = [...new Set(assignments.map(a => a.role_label))];
    const allRoles = new Set(['Door', 'Host', ...usedRoles, ...extraRoleCols]);
    return [...allRoles].sort((a, b) => {
      const priority = { Door: 0, Host: 1 };
      const pa = priority[a] ?? 2, pb = priority[b] ?? 2;
      return pa !== pb ? pa - pb : a.localeCompare(b);
    });
  }

  function renderTable() {
    const table = document.getElementById('staffTable');
    const roles = getRoleCols();

    let html = '<thead><tr><th class="corner">Event</th>';
    for (const role of roles) html += `<th>${escapeHtml(role)}</th>`;
    html += '</tr></thead><tbody>';

    for (const ev of events) {
      html += `<tr><td class="event-cell">${escapeHtml(ev.event_date)}<br><span class="meta">${TYPE_LABEL[ev.event_type]}</span></td>`;
      for (const role of roles) {
        const isEditing = isAdmin && editingCell && editingCell.eventId === ev.id && editingCell.role === role;
        const clickable = isAdmin && !isEditing ? 'clickable' : '';
        const editingClass = isEditing ? 'editing' : '';
        html += `<td class="assign-cell ${clickable} ${editingClass}" data-event-id="${ev.id}" data-role="${escapeHtml(role)}">`;
        html += isEditing ? buildEditCellHtml(ev.id, role) : buildDisplayCellHtml(ev.id, role);
        html += '</td>';
      }
      html += '</tr>';
    }
    html += '</tbody>';
    table.innerHTML = html;
    wireCellEvents();
  }

  function buildDisplayCellHtml(eventId, role) {
    const cellAssignments = assignments.filter(a => a.event_id === eventId && a.role_label === role);
    return cellAssignments.map(a => escapeHtml(nameById[a.person_id] || '?')).join(', ') || '--';
  }

  function buildEditCellHtml(eventId, role) {
    const current = assignments.filter(a => a.event_id === eventId && a.role_label === role);
    let html = '';
    for (const a of current) {
      html += `<div class="cell-person-row"><span>${escapeHtml(nameById[a.person_id] || '?')}</span>
        <button class="cell-x-btn" data-remove-id="${a.id}" title="Remove">✕</button></div>`;
    }
    if (current.length === 0) html += `<div class="meta" style="font-size:0.75rem;">No one yet</div>`;

    if (current.length < MAX_PER_ROLE) {
      html += `<select class="cell-select" data-add-select="1">
        <option value="">+ Add person…</option>`;
      for (const p of pool) html += `<option value="${p.id}">${escapeHtml(p.name)}</option>`;
      html += `<option value="__new__">+ New person…</option></select>`;
      html += `<div data-new-person-fields style="display:none; margin-top:4px;">
        <input type="text" class="cell-select" data-new-person-name placeholder="Name" style="min-height:auto; padding:6px;">
        <button class="btn-secondary" data-new-person-confirm style="width:100%; padding:6px; font-size:0.78rem; margin-top:4px;">Add</button>
      </div>`;
    }
    html += `<button class="cell-close-btn" data-close-cell="1">Close</button>`;
    return html;
  }

  function wireCellEvents() {
    if (!isAdmin) return;

    document.querySelectorAll('td.assign-cell.clickable').forEach(td => {
      td.addEventListener('click', () => {
        editingCell = { eventId: parseInt(td.dataset.eventId, 10), role: td.dataset.role };
        renderTable();
      });
    });

    document.querySelectorAll('td.assign-cell.editing').forEach(td => {
      const eventId = parseInt(td.dataset.eventId, 10);
      const role = td.dataset.role;

      td.querySelectorAll('[data-remove-id]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const { error } = await supabase.from('event_staff_assignments').delete().eq('id', parseInt(btn.dataset.removeId, 10));
          if (error) { toast('Could not remove: ' + error.message); return; }
          assignments = assignments.filter(a => a.id !== parseInt(btn.dataset.removeId, 10));
          renderTable();
        });
      });

      const closeBtn = td.querySelector('[data-close-cell]');
      if (closeBtn) closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        editingCell = null;
        renderTable();
      });

      const select = td.querySelector('[data-add-select]');
      if (select) select.addEventListener('click', (e) => e.stopPropagation());
      if (select) select.addEventListener('change', async (e) => {
        e.stopPropagation();
        const val = select.value;
        if (val === '__new__') {
          td.querySelector('[data-new-person-fields]').style.display = 'block';
          return;
        }
        if (!val) return;
        await assignPerson(eventId, role, parseInt(val, 10));
      });

      const confirmBtn = td.querySelector('[data-new-person-confirm]');
      if (confirmBtn) confirmBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const nameInput = td.querySelector('[data-new-person-name]');
        const name = nameInput.value.trim();
        if (!name) { toast('Name is required.'); return; }
        const { data, error } = await supabase.from('event_staff_pool').insert({ name }).select().single();
        if (error) { toast('Could not add person: ' + error.message); return; }
        await loadPool();
        await assignPerson(eventId, role, data.id);
      });

      td.addEventListener('click', (e) => e.stopPropagation());
    });
  }

  async function assignPerson(eventId, role, personId) {
    const { error } = await supabase.from('event_staff_assignments').insert({
      event_id: eventId, role_label: role, person_id: personId,
    });
    if (error) {
      toast(error.code === '23505' ? 'That person is already assigned to this role.' : 'Could not assign: ' + error.message);
      return;
    }
    const { data: newRow } = await supabase.from('event_staff_assignments')
      .select('id, event_id, role_label, person_id').eq('event_id', eventId).eq('role_label', role).eq('person_id', personId).single();
    if (newRow) assignments.push(newRow);
    if (!nameById[personId]) {
      const found = pool.find(p => p.id === personId);
      if (found) nameById[personId] = found.name;
    }
    toast('Assigned.');
    renderTable();
  }

  document.getElementById('loadMoreBtn').addEventListener('click', () => {
    rangeStart = isoDate(addMonths(new Date(rangeStart), -3));
    rangeEnd = isoDate(addMonths(new Date(rangeEnd), 3));
    loadData();
  });

  document.getElementById('addRoleBtn').addEventListener('click', () => {
    const name = document.getElementById('newRoleName').value.trim();
    if (!name) return;
    if (!extraRoleCols.includes(name)) extraRoleCols.push(name);
    document.getElementById('newRoleName').value = '';
    renderTable();
  });

  if (isAdmin) await loadPool();
  await loadData();
</script>
</body>
</html>
