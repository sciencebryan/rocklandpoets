<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockland Poets — Check In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="header">
    <img src="logo.png" alt="Rockland Poets" style="height:44px; width:auto;">
    <div style="text-align:right;">
      <div class="meta mono" id="eventLabel">loading…</div>
      <a href="rounds.html" style="font-size:0.8rem; color:var(--wine); text-decoration:none;">Round entry</a> ·
      <button class="btn-ghost" id="signOutBtn" style="padding:2px 0; min-height:auto; font-size:0.8rem;">Sign out</button>
    </div>
  </div>

  <div id="eventPicker" class="card" style="display:none;">
    <label for="eventDate">Tonight's date</label>
    <input type="date" id="eventDate">
    <label for="eventType">Event type</label>
    <select id="eventType">
      <option value="slam">Slam</option>
      <option value="open_mic">Open mic</option>
    </select>
    <button class="btn-primary" id="setEventBtn" style="margin-top:14px;">Start / find this event</button>
  </div>

  <div id="mainArea" style="display:none;">
    <input type="text" id="search" placeholder="Type a name to find yourself…" autocomplete="off" style="margin-bottom:12px;">

    <div id="results"></div>

    <div id="confirmPanel" class="card" style="display:none; border-left: 4px solid var(--accent-2);">
      <div style="font-weight:600; margin-bottom:8px;">Is this you?</div>
      <div id="confirmList"></div>
      <button class="btn-ghost" id="cancelConfirm" style="margin-top:8px;">None of these — cancel</button>
    </div>

    <div id="addForm" class="card" style="display:none;">
      <div style="font-weight:600; margin-bottom:4px;">New here? Welcome.</div>
      <div class="meta" style="margin-bottom:8px;">Everything except your first name is optional.</div>

      <label for="addFirst">First name</label>
      <input type="text" id="addFirst">

      <label for="addLast">Last name (or just an initial)</label>
      <input type="text" id="addLast">

      <label for="addNickname">Nickname — if you'd rather go by this publicly</label>
      <input type="text" id="addNickname">

      <label for="addEmail">Email (optional)</label>
      <input type="email" id="addEmail">

      <label for="addPhone">Phone (optional)</label>
      <input type="tel" id="addPhone">

      <label for="addReferral">How'd you hear about us? (optional)</label>
      <select id="addReferral"><option value="">— Select —</option></select>

      <label for="addPronouns">Pronouns (optional)</label>
      <input type="text" id="addPronouns">

      <label for="addPhotoConsent">Okay to post event photos of you? (optional)</label>
      <select id="addPhotoConsent">
        <option value="">— Select —</option>
        <option value="Yes, you can post photos that I'm in">Yes, that's fine</option>
        <option value="No, please blur me out of any photos you post">No, please blur me out</option>
      </select>

      <div id="addError" class="error-box" style="display:none;"></div>

      <button class="btn-primary" id="submitAdd" style="margin-top:16px;">Add me & check in</button>
      <button class="btn-ghost" id="cancelAdd" style="margin-top:4px;">Cancel</button>
    </div>

    <div id="signupPrompt" class="card" style="display:none; border-left: 4px solid var(--brass);">
      <div id="signupPromptText" style="font-weight:600; margin-bottom:10px;"></div>
      <button class="btn-primary" id="signupYes" style="margin-bottom:8px;">Yes, sign me up</button>
      <button class="btn-ghost" id="signupNo">No thanks</button>
    </div>

    <div id="slamControls" class="card" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>Sign-ups tonight: <strong id="signupCount" class="mono">0</strong></span>
        <button class="btn-secondary" id="closeSignupsBtn" style="width:auto; padding:10px 16px;">Close sign-ups & draw</button>
      </div>
    </div>

    <div id="drawResults" style="display:none;">
      <h2 style="font-size:1.1rem; margin-top:20px; margin-bottom:10px;">Tonight's competing order</h2>
      <div id="competingList"></div>
      <div id="cutListWrapper" style="display:none; margin-top:16px;">
        <div class="meta" style="margin-bottom:8px;">Randomized out (still eligible to compete another night):</div>
        <div id="cutList"></div>
      </div>
    </div>

    <h2 style="font-size:1.1rem; margin-top:28px; margin-bottom:10px;">Tonight's roster (<span id="rosterCount">0</span>)</h2>
    <div id="roster"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---- Auth guard ----
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  // ---- Toast helper ----
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ---- Event selection ----
  let currentEvent = null; // { id, event_date }

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  async function findOrCreateEvent(dateStr, eventType) {
    let { data: existing, error } = await supabase.from('events').select('id, event_date, event_type, signups_closed_at').eq('event_date', dateStr).maybeSingle();
    if (error) { toast('Error loading event: ' + error.message); return null; }
    if (existing) return existing;

    const { data: created, error: createError } = await supabase.from('events').insert({ event_date: dateStr, event_type: eventType }).select().single();
    if (createError) { toast('Error creating event: ' + createError.message); return null; }
    return created;
  }

  async function setEvent(dateStr, eventType) {
    const ev = await findOrCreateEvent(dateStr, eventType);
    if (!ev) return;
    currentEvent = ev;
    document.getElementById('eventLabel').textContent = `${ev.event_date} · ${ev.event_type === 'slam' ? 'Slam' : 'Open mic'}`;
    document.getElementById('eventPicker').style.display = 'none';
    document.getElementById('mainArea').style.display = 'block';
    await loadRoster();
    await refreshSlamUI();
  }

  document.getElementById('eventDate').value = todayISO();
  document.getElementById('setEventBtn').addEventListener('click', () => {
    const dateStr = document.getElementById('eventDate').value;
    const eventType = document.getElementById('eventType').value;
    if (dateStr) setEvent(dateStr, eventType);
  });

  // Auto-start with today's event
  document.getElementById('eventDate').value = todayISO();
  document.getElementById('eventPicker').style.display = 'block';

  // ---- Search ----
  const searchEl = document.getElementById('search');
  const resultsEl = document.getElementById('results');
  let searchDebounce;

  searchEl.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(runSearch, 250);
  });

  async function runSearch() {
    const q = searchEl.value.trim();
    resultsEl.innerHTML = '';
    document.getElementById('confirmPanel').style.display = 'none';
    document.getElementById('addForm').style.display = 'none';

    if (q.length < 2) return;

    const { data, error } = await supabase
      .from('attendee_display')
      .select('id, display_name')
      .ilike('display_name', `%${q}%`)
      .limit(15);

    if (error) { toast('Search error: ' + error.message); return; }

    // Always offer "add yourself" alongside results -- someone may share a
    // name with existing attendees without being one of them
    const addRow = document.createElement('button');
    addRow.className = 'btn-secondary';
    addRow.style.cssText = 'margin-top:4px;';
    addRow.textContent = "Don't see yourself? Add your name";
    addRow.addEventListener('click', () => {
      document.getElementById('addFirst').value = q;
      document.getElementById('addForm').style.display = 'block';
    });
    resultsEl.appendChild(addRow);

    if (!data || data.length === 0) {
      return;
    }

    // Collapse duplicate display_names into one tappable row (collision handled on tap)
    const uniqueNames = [...new Set(data.map(d => d.display_name))];
    for (const name of uniqueNames) {
      const row = document.createElement('button');
      row.className = 'roster-row';
      row.style.cssText += 'border:1px solid var(--line); border-left:4px solid var(--brass); cursor:pointer; font-family:inherit;';
      row.innerHTML = `<span class="name">${escapeHtml(name)}</span><span class="meta">Tap to check in</span>`;
      row.addEventListener('click', () => selectName(name, data.filter(d => d.display_name === name)));
      resultsEl.appendChild(row);
    }
  }

  async function selectName(name, matches) {
    // Check for a real collision (people who share this exact display name)
    const { data: candidates, error } = await supabase
      .from('attendee_confirm_candidates')
      .select('id, disambiguator')
      .eq('base_name', name);

    if (error) { toast('Error: ' + error.message); return; }

    if (candidates && candidates.length > 1) {
      showConfirmPanel(name, candidates);
    } else if (matches.length === 1) {
      checkIn(matches[0].id, name);
    } else {
      // No collision info and multiple raw matches (shouldn't normally happen) -- ask to confirm via disambiguator anyway
      showConfirmPanel(name, candidates && candidates.length ? candidates : matches.map(m => ({ id: m.id, disambiguator: '(no extra info on file)' })));
    }
  }

  function showConfirmPanel(name, candidates) {
    const panel = document.getElementById('confirmPanel');
    const list = document.getElementById('confirmList');
    list.innerHTML = '';
    for (const c of candidates) {
      const btn = document.createElement('button');
      btn.className = 'roster-row';
      btn.style.cssText += 'border:1px solid var(--line); border-left:4px solid var(--brass); cursor:pointer; font-family:inherit;';
      btn.innerHTML = `<span class="name">${escapeHtml(name)}</span><span class="mono meta">${escapeHtml(c.disambiguator || '')}</span>`;
      btn.addEventListener('click', () => { panel.style.display = 'none'; checkIn(c.id, name); });
      list.appendChild(btn);
    }
    panel.style.display = 'block';
  }

  document.getElementById('cancelConfirm').addEventListener('click', () => {
    document.getElementById('confirmPanel').style.display = 'none';
  });

  async function checkIn(attendeeId, name) {
    const { error } = await supabase
      .from('attendance')
      .upsert({ attendee_id: attendeeId, event_id: currentEvent.id }, { onConflict: 'attendee_id,event_id', ignoreDuplicates: true });

    if (error) { toast('Check-in failed: ' + error.message); return; }

    toast(`Checked in: ${name}`);
    searchEl.value = '';
    resultsEl.innerHTML = '';
    await loadRoster();

    if (currentEvent.event_type === 'slam' && !currentEvent.signups_closed_at) {
      promptSignup(attendeeId, name);
    }
  }

  function promptSignup(attendeeId, name) {
    document.getElementById('signupPromptText').textContent = `${name} — want to sign up to compete tonight?`;
    document.getElementById('signupPrompt').style.display = 'block';

    const yesBtn = document.getElementById('signupYes');
    const noBtn = document.getElementById('signupNo');
    const newYes = yesBtn.cloneNode(true); yesBtn.replaceWith(newYes); // clear old listeners
    const newNo = noBtn.cloneNode(true); noBtn.replaceWith(newNo);

    newYes.addEventListener('click', async () => {
      const { error } = await supabase.from('slam_signups')
        .upsert({ event_id: currentEvent.id, attendee_id: attendeeId }, { onConflict: 'event_id,attendee_id', ignoreDuplicates: true });
      if (error) { toast('Sign-up failed: ' + error.message); return; }
      toast(`Signed up: ${name}`);
      document.getElementById('signupPrompt').style.display = 'none';
      await refreshSlamUI();
    });
    newNo.addEventListener('click', () => {
      document.getElementById('signupPrompt').style.display = 'none';
    });
  }

  // ---- Add new attendee ----
  document.getElementById('cancelAdd').addEventListener('click', () => {
    document.getElementById('addForm').style.display = 'none';
  });

  async function loadReferralSources() {
    const { data, error } = await supabase.from('referral_sources').select('id, label').order('label');
    if (error) return;
    const sel = document.getElementById('addReferral');
    for (const r of data) {
      const opt = document.createElement('option');
      opt.value = r.id;
      opt.textContent = r.label;
      sel.appendChild(opt);
    }
  }
  loadReferralSources();

  document.getElementById('submitAdd').addEventListener('click', async () => {
    const first = document.getElementById('addFirst').value.trim();
    const errEl = document.getElementById('addError');
    errEl.style.display = 'none';

    if (!first) { errEl.textContent = 'First name is required.'; errEl.style.display = 'block'; return; }

    const payload = {
      first_name: first,
      last_name: document.getElementById('addLast').value.trim() || null,
      nickname: document.getElementById('addNickname').value.trim() || null,
      email: document.getElementById('addEmail').value.trim() || null,
      phone: document.getElementById('addPhone').value.trim() || null,
      referral_source_id: document.getElementById('addReferral').value || null,
      pronouns: document.getElementById('addPronouns').value.trim() || null,
      photo_consent: document.getElementById('addPhotoConsent').value || null,
    };

    const { data: newAttendee, error } = await supabase.from('attendees').insert(payload).select().single();
    if (error) { errEl.textContent = 'Could not save: ' + error.message; errEl.style.display = 'block'; return; }

    document.getElementById('addForm').style.display = 'none';
    document.getElementById('addFirst').value = '';
    document.getElementById('addLast').value = '';
    document.getElementById('addNickname').value = '';
    document.getElementById('addEmail').value = '';
    document.getElementById('addPhone').value = '';
    document.getElementById('addPronouns').value = '';

    await checkIn(newAttendee.id, first);
  });

  // ---- Roster ----
  async function loadRoster() {
    if (!currentEvent) return;
    const { data: attendanceRows, error } = await supabase
      .from('attendance')
      .select('id, attendee_id')
      .eq('event_id', currentEvent.id)
      .order('id', { ascending: true });

    const rosterEl = document.getElementById('roster');
    rosterEl.innerHTML = '';

    if (error) { toast('Roster load error: ' + error.message); return; }

    document.getElementById('rosterCount').textContent = attendanceRows ? attendanceRows.length : 0;

    if (!attendanceRows || attendanceRows.length === 0) {
      rosterEl.innerHTML = '<div class="empty-state">No one checked in yet tonight.</div>';
      return;
    }

    const ids = attendanceRows.map(r => r.attendee_id);
    const { data: names, error: nameError } = await supabase
      .from('attendee_display')
      .select('id, display_name')
      .in('id', ids);

    if (nameError) { toast('Roster load error: ' + nameError.message); return; }

    const nameById = Object.fromEntries((names || []).map(n => [n.id, n.display_name]));

    for (const row of attendanceRows) {
      const div = document.createElement('div');
      div.className = 'roster-row checked-in';
      const name = nameById[row.attendee_id] || '(unknown)';
      div.innerHTML = `<span class="name">${escapeHtml(name)}</span>`;

      const rightSide = document.createElement('span');
      rightSide.style.cssText = 'display:flex; align-items:center; gap:8px;';
      rightSide.innerHTML = `<span class="badge">✓ here</span>`;

      const removeBtn = document.createElement('button');
      removeBtn.textContent = 'Remove';
      removeBtn.className = 'btn-ghost';
      removeBtn.style.cssText = 'padding:4px 8px; min-height:auto; font-size:0.78rem; color:var(--rust);';
      removeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        if (!confirm(`Remove ${name} from tonight's check-in? This can't be undone here.`)) return;
        await removeCheckIn(row.attendee_id, name);
      });
      rightSide.appendChild(removeBtn);
      div.appendChild(rightSide);
      rosterEl.appendChild(div);
    }
  }

  async function removeCheckIn(attendeeId, name) {
    // Clean up any sign-up for this event too, since they shouldn't remain
    // signed up to compete if they weren't actually here
    await supabase.from('slam_signups').delete().eq('event_id', currentEvent.id).eq('attendee_id', attendeeId);

    const { error } = await supabase.from('attendance').delete()
      .eq('event_id', currentEvent.id).eq('attendee_id', attendeeId);

    if (error) { toast('Could not remove: ' + error.message); return; }

    toast(`Removed: ${name}`);
    await loadRoster();
    await refreshSlamUI();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Slam sign-ups: counts, close & draw, results ----
  async function refreshSlamUI() {
    const slamControls = document.getElementById('slamControls');
    const drawResults = document.getElementById('drawResults');

    if (currentEvent.event_type !== 'slam') {
      slamControls.style.display = 'none';
      drawResults.style.display = 'none';
      return;
    }

    if (currentEvent.signups_closed_at) {
      slamControls.style.display = 'none';
      await showDrawResults();
    } else {
      drawResults.style.display = 'none';
      slamControls.style.display = 'block';
      const { count } = await supabase.from('slam_signups').select('id', { count: 'exact', head: true }).eq('event_id', currentEvent.id);
      document.getElementById('signupCount').textContent = count ?? 0;
    }
  }

  document.getElementById('closeSignupsBtn').addEventListener('click', async () => {
    const btn = document.getElementById('closeSignupsBtn');
    btn.disabled = true;
    btn.textContent = 'Drawing…';

    const { data: signups, error } = await supabase.from('slam_signups').select('id, attendee_id').eq('event_id', currentEvent.id);
    if (error) { toast('Error loading sign-ups: ' + error.message); btn.disabled = false; btn.textContent = 'Close sign-ups & draw'; return; }

    if (!signups || signups.length === 0) {
      toast('No sign-ups to draw from.');
      btn.disabled = false; btn.textContent = 'Close sign-ups & draw';
      return;
    }

    // Fisher-Yates shuffle
    const shuffled = [...signups];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    const competing = shuffled.slice(0, 8);
    const cut = shuffled.slice(8);
    const now = new Date().toISOString();

    const updates = [
      ...competing.map((s, i) => ({ event_id: currentEvent.id, attendee_id: s.attendee_id, draw_order: i + 1, randomized_out: false, randomized_out_at: null })),
      ...cut.map(s => ({ event_id: currentEvent.id, attendee_id: s.attendee_id, draw_order: null, randomized_out: true, randomized_out_at: now })),
    ];

    const { error: upsertError } = await supabase.from('slam_signups').upsert(updates, { onConflict: 'event_id,attendee_id' });
    if (upsertError) { toast('Draw failed: ' + upsertError.message); btn.disabled = false; btn.textContent = 'Close sign-ups & draw'; return; }

    const { error: eventError } = await supabase.from('events').update({ signups_closed_at: now }).eq('id', currentEvent.id);
    if (eventError) { toast('Error closing sign-ups: ' + eventError.message); btn.disabled = false; btn.textContent = 'Close sign-ups & draw'; return; }

    currentEvent.signups_closed_at = now;
    toast('Sign-ups closed, draw complete.');
    await refreshSlamUI();
  });

  async function showDrawResults() {
    const { data: signups, error } = await supabase.from('slam_signups').select('attendee_id, draw_order, randomized_out').eq('event_id', currentEvent.id);
    if (error) { toast('Error loading draw results: ' + error.message); return; }

    const ids = signups.map(s => s.attendee_id);
    const { data: names } = await supabase.from('attendee_display').select('id, display_name').in('id', ids.length ? ids : [0]);
    const nameById = Object.fromEntries((names || []).map(n => [n.id, n.display_name]));

    const competing = signups.filter(s => !s.randomized_out).sort((a, b) => a.draw_order - b.draw_order);
    const cut = signups.filter(s => s.randomized_out);

    const competingList = document.getElementById('competingList');
    competingList.innerHTML = '';
    for (const s of competing) {
      const row = document.createElement('div');
      row.className = 'roster-row';
      row.innerHTML = `<span class="name">${escapeHtml(nameById[s.attendee_id] || '(unknown)')}</span><span class="badge mono">#${s.draw_order}</span>`;
      competingList.appendChild(row);
    }

    const cutWrapper = document.getElementById('cutListWrapper');
    const cutList = document.getElementById('cutList');
    cutList.innerHTML = '';
    if (cut.length > 0) {
      cutWrapper.style.display = 'block';
      for (const s of cut) {
        const row = document.createElement('div');
        row.className = 'roster-row';
        row.style.borderLeftColor = 'var(--line)';
        row.innerHTML = `<span class="name">${escapeHtml(nameById[s.attendee_id] || '(unknown)')}</span>`;
        cutList.appendChild(row);
      }
    } else {
      cutWrapper.style.display = 'none';
    }

    document.getElementById('drawResults').style.display = 'block';
  }
</script>
</body>
</html>
