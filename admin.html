<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockland Poets — Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="header">
    <img src="logo.png" alt="Rockland Poets" style="height:44px; width:auto;">
    <a href="checkin.html" style="font-size:0.8rem; color:var(--wine); text-decoration:none;">← Check-in</a>
  </div>

  <div id="deniedNotice" style="display:none;" class="error-box">
    This page is admin-only.
  </div>

  <div id="mainArea" style="display:none;">
    <h1 style="font-size:1.3rem; margin-bottom:6px;">Organizer access</h1>
    <p class="meta" style="margin-bottom:16px;">
      To add someone brand new: create their login in the
      <a href="https://supabase.com/dashboard" target="_blank" style="color:var(--wine);">Supabase dashboard</a>
      first (Authentication → Users), copy their UID, then register them below.
    </p>

    <div id="peopleList"></div>

    <h2 style="font-size:1.1rem; margin-top:28px; margin-bottom:10px;">Register an existing account</h2>
    <div class="card">
      <label for="newUid">User ID (from Supabase Auth)</label>
      <input type="text" id="newUid" placeholder="e.g. 1fdb07a1-6bcf-449d-88cf-6796c87fda55">
      <label for="newDisplayName">Display name</label>
      <input type="text" id="newDisplayName">
      <label for="newRole">Role</label>
      <select id="newRole">
        <option value="checkin_staff">Check-in staff</option>
        <option value="event_lead">Event lead</option>
        <option value="organizer">Organizer</option>
        <option value="admin">Admin</option>
      </select>
      <div id="addError" class="error-box" style="display:none;"></div>
      <button class="btn-primary" id="addBtn" style="margin-top:16px;">Register</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) window.location.href = 'login.html';

  const { data: myRoleRow } = await supabase.from('organizer_roles').select('role').eq('user_id', session.user.id).maybeSingle();

  if (myRoleRow?.role !== 'admin') {
    document.getElementById('deniedNotice').style.display = 'block';
  } else {
    document.getElementById('mainArea').style.display = 'block';
    loadPeople();
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  const ROLE_LABELS = {
    checkin_staff: 'Check-in staff',
    event_lead: 'Event lead',
    organizer: 'Organizer',
    admin: 'Admin',
  };

  async function loadPeople() {
    const { data, error } = await supabase.from('organizer_roles').select('user_id, role, display_name, created_at').order('created_at', { ascending: true });
    const listEl = document.getElementById('peopleList');

    if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }
    if (!data || data.length === 0) { listEl.innerHTML = '<div class="empty-state">No organizers registered yet.</div>'; return; }

    listEl.innerHTML = '';
    for (const person of data) {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.display = 'flex';
      card.style.alignItems = 'center';
      card.style.justifyContent = 'space-between';
      card.style.gap = '10px';

      const isMe = person.user_id === session.user.id;

      card.innerHTML = `
        <div style="flex:1;">
          <div style="font-weight:600;">${escapeHtml(person.display_name || '(no name set)')}${isMe ? ' <span class="meta">(you)</span>' : ''}</div>
          <div class="mono meta" style="font-size:0.7rem;">${escapeHtml(person.user_id)}</div>
        </div>
      `;

      const controls = document.createElement('div');
      controls.style.cssText = 'display:flex; align-items:center; gap:8px;';

      const select = document.createElement('select');
      select.style.cssText = 'width:auto; min-height:auto; padding:8px 10px; font-size:0.85rem;';
      for (const [value, label] of Object.entries(ROLE_LABELS)) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        if (value === person.role) opt.selected = true;
        select.appendChild(opt);
      }
      select.addEventListener('change', async () => {
        if (isMe && select.value !== 'admin') {
          if (!confirm("You're about to remove your own admin access. Continue?")) {
            select.value = person.role;
            return;
          }
        }
        const { error } = await supabase.from('organizer_roles').update({ role: select.value }).eq('user_id', person.user_id);
        if (error) { toast('Could not update role: ' + error.message); select.value = person.role; return; }
        toast(`${person.display_name || 'Role'} updated to ${ROLE_LABELS[select.value]}.`);
        person.role = select.value;
      });
      controls.appendChild(select);

      const revokeBtn = document.createElement('button');
      revokeBtn.textContent = 'Revoke';
      revokeBtn.className = 'btn-ghost';
      revokeBtn.style.cssText = 'padding:6px 10px; min-height:auto; font-size:0.8rem; color:var(--rust);';
      revokeBtn.addEventListener('click', async () => {
        if (isMe) { toast("You can't revoke your own access here."); return; }
        if (!confirm(`Revoke organizer access for ${person.display_name || person.user_id}?`)) return;
        const { error } = await supabase.from('organizer_roles').delete().eq('user_id', person.user_id);
        if (error) { toast('Could not revoke: ' + error.message); return; }
        toast('Access revoked.');
        loadPeople();
      });
      controls.appendChild(revokeBtn);

      card.appendChild(controls);
      listEl.appendChild(card);
    }
  }

  document.getElementById('addBtn').addEventListener('click', async () => {
    const uid = document.getElementById('newUid').value.trim();
    const displayName = document.getElementById('newDisplayName').value.trim();
    const role = document.getElementById('newRole').value;
    const errEl = document.getElementById('addError');
    errEl.style.display = 'none';

    const uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if (!uuidPattern.test(uid)) {
      errEl.textContent = "That doesn't look like a valid UID -- copy it exactly from the Supabase dashboard.";
      errEl.style.display = 'block';
      return;
    }

    const { error } = await supabase.from('organizer_roles').insert({ user_id: uid, role, display_name: displayName || null });
    if (error) {
      errEl.textContent = error.code === '23505'
        ? 'This person is already registered -- change their role in the list above instead.'
        : 'Could not register: ' + error.message;
      errEl.style.display = 'block';
      return;
    }

    toast('Registered.');
    document.getElementById('newUid').value = '';
    document.getElementById('newDisplayName').value = '';
    loadPeople();
  });
</script>
</body>
</html>
